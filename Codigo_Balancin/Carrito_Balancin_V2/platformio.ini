; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
; La ruta del proyecto tiene tildes ("Mecatrónica") y el enlazador no puede
; escribir firmware.map ahí; por eso el build va a una carpeta sin tildes.
build_dir = C:/pio_build/Carrito_Balancin_V2

[env:esp32-s3-devkitm-1]
; pioarduino: core ESP32 de Arduino 3.x (ESP-IDF 5), necesario para el driver PCNT nuevo y ledcAttach
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-s3-devkitm-1
framework = arduino
monitor_speed = 115200

; Mismos flags del board, salvo ARDUINO_EVENT_RUNNING_CORE: los eventos de red
; de Arduino pasan al núcleo 0 (junto con WiFi/lwIP) para dejar el 1 al control.
board_build.extra_flags =
    -DARDUINO_ESP32S3_DEV
    -DARDUINO_USB_MODE=1
    -DARDUINO_RUNNING_CORE=1
    -DARDUINO_EVENT_RUNNING_CORE=0
